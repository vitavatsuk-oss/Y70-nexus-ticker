<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crypto + FX</title>

<!--
  ============================================================
  Crypto (หมุน) + FX (นิ่ง) — สำหรับ iframe widget ของ HYTE Y70 Touch
  ============================================================
  ไฟล์เดียวจบ ไม่มี dependency ภายนอก

  แหล่งข้อมูล 3 เส้นทาง:
    1. Binance Spot WebSocket  — real-time push (BTC/ETH/SOL/BNB/BAT)
    2. Bybit Spot REST         — polling 10 วิ (MNT)
    3. Frankfurter REST        — FX รายวัน (6 สกุล)

  ปรับแต่งทั้งหมดที่ block CONFIG

  Layout ปรับตัวเองตามสัดส่วนช่อง widget:
    ratio < 0.30  → mini : ราคา + % เท่านั้น
    ratio < 0.80  → wide : crypto + FX (ตัด High/Low)   ← 4x2
    ratio >= 0.80 → full : ครบทุกอย่าง                   ← 4x4

  แตะจอ = ข้ามไปเหรียญถัดไป
  ============================================================
-->

<style>
  :root{
    --up:   #7CFF9B;
    --down: #FF6B6B;
    --fg:   #F2F5F3;
    --dim:  #6B7A72;
    --label: rgba(255,255,255,.86);   /* สี label ทั้งหมด — ขาวเพื่อให้อ่านจากระยะไกล */

    /* ความจางของสกุลที่วันที่เก่ากว่าตัวอื่น (เช่น TWD)
       1 = ไม่หรี่เลย · 0.8 = หรี่พอสังเกต · 0.5 = จางมาก           */
    --lag-opacity: .82;

    /* ตัวคูณขนาดฟอนต์ฝั่งค่าเงิน — JS ปรับเองเพื่อคุมสัดส่วนซ้าย:ขวา */
    --fx-scale: 1;

    /* ---- พื้นหลัง ----
       ค่าเริ่มต้นนี้ใช้เมื่อไม่ได้ใส่ ?bg= ใน URL (ดูตาราง BG ใน CONFIG)
       หมายเหตุ: Web View ของ Nexus 3 render เป็นหน้าเว็บจริง ฐานเป็นสีขาว
       ดังนั้นสีโปร่ง (alpha ต่ำ) จะผสมกับขาว ได้ผลเป็นเทาอ่อน ไม่ใช่ทินท์มืด
       แบบ iframe เดิม — ถ้าอยากได้การ์ดมืด ต้องใช้ alpha สูงหรือสีทึบ   */
    --bg: #0A0E0C;

    /* เงาตัวอักษร — จำเป็นเฉพาะตอนพื้นโปร่งทับ wallpaper
       พื้นทึบไม่ต้องใช้ ตัวอักษรคมกว่า (JS เปิดให้เองเมื่อ ?bg= เป็นสีโปร่ง) */
    --shadow: none;

    --accent: var(--up);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ width:100%; height:100%; background:transparent; overflow:hidden; }

  body{
    width:100%; height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family:"Cascadia Mono","SF Mono","Consolas",monospace,system-ui;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
    color:var(--fg);
    text-shadow:var(--shadow);
    cursor:pointer;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    display:flex; align-items:center; justify-content:center;
  }

  #wrap{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; text-align:center;
  }

  /* #inner กว้าง/สูงตามเนื้อหาจริง — เป็นตัววัดของ auto-fit */
  #inner{
    display:flex; flex-direction:column; align-items:center;
    width:max-content; max-width:100%;
  }

  /* ================= ส่วน CRYPTO ================= */
  #crypto{
    display:flex; flex-direction:column; align-items:center;
    width:100%; gap:0.4rem;
    transition:opacity .18s ease;   /* crossfade ตอนสลับเหรียญ */
  }
  #crypto.fading{ opacity:0; }

  #pair{
    font-size:0.95rem; letter-spacing:0.16em; font-weight:700;
    color:var(--label); text-transform:uppercase;
    display:flex; align-items:center; gap:0.5em; justify-content:center;
  }
  #dot{
    width:0.42em; height:0.42em; border-radius:50%;
    background:var(--accent); box-shadow:0 0 0.6em var(--accent);
    transition:background .3s, box-shadow .3s, opacity .3s;
  }
  body[data-conn="down"] #dot{ background:var(--dim); box-shadow:none; opacity:.5; }
  body[data-conn="live"] #dot{ animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }

  /* min-width ตั้งด้วย JS เป็นหน่วย ch = ล็อกความกว้างตามเหรียญที่ยาวสุด
     ฟอนต์เป็น monospace + tabular-nums -> 1 ch = 1 ตัวอักษรพอดี
     ผลคือสลับเหรียญแล้วขนาดฟอนต์ไม่กระโดด                       */
  #price{
    font-size:3.5rem; font-weight:700; line-height:1;
    letter-spacing:-0.02em; white-space:nowrap;
    transition:color .45s ease;
  }
  #price.flash-up{ color:var(--up); }
  #price.flash-down{ color:var(--down); }

  #change{
    font-size:1.3rem; font-weight:600; color:var(--accent);
    display:flex; align-items:baseline; gap:0.45em; justify-content:center;
  }
  #change .abs{ font-size:0.7em; opacity:.55; font-weight:500; }

  #hl{
    display:flex; gap:1.6rem; justify-content:center;
    font-size:0.9rem; color:var(--label); font-weight:700;
  }
  #hl span{ letter-spacing:0.1em; text-transform:uppercase; font-size:0.8em; opacity:.75; }
  #hl b{ color:#fff; font-weight:700; display:block; font-size:1.2em; margin-top:0.2em; }

  #spark{ width:100%; height:4.2rem; display:block; overflow:visible; }
  #sparkLine{
    fill:none; stroke:var(--accent); stroke-width:2;
    stroke-linejoin:round; stroke-linecap:round;
    vector-effect:non-scaling-stroke;
    filter:drop-shadow(0 0 3px rgba(0,0,0,.85));
  }
  #sparkFill{ fill:var(--accent); opacity:.14; }

  /* แถบ progress ของรอบหมุน */
  #prog{
    width:100%; height:0.09rem; background:rgba(255,255,255,.10);
    border-radius:1px; overflow:hidden; margin-top:0.15rem;
  }
  #progBar{ width:0; height:100%; background:var(--accent); opacity:.55; }

  /* ================= ส่วน FIAT ================= */
  #sep{
    width:100%; height:1px; margin:0.75rem 0 0.65rem;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);
  }

  #fiat{ width:100%; display:flex; flex-direction:column; align-items:center; }

  #fxGrid{
    width:100%;
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:0.35rem 0.6rem;
  }
  /* หนึ่งสกุล = หนึ่งบรรทัด: label ซ้าย ตัวเลขขวา
     min-width 5ch + จัดชิดขวา -> จุดทศนิยมตรงกันทุกแถว (ฟอนต์ monospace) */
  .fx{
    display:flex; align-items:baseline; justify-content:space-between; gap:0.6rem;
  }
  .fx span{
    font-size:calc(0.78rem * var(--fx-scale)); letter-spacing:0.08em; font-weight:700;
    color:var(--label); text-transform:uppercase; opacity:.8; white-space:nowrap;
  }
  .fx b{
    font-size:calc(1.3rem * var(--fx-scale)); font-weight:700; color:#fff;
    min-width:5ch; text-align:right;
  }
  .fx.miss b{ color:var(--dim); font-weight:500; }
  .fx.lag{ opacity:var(--lag-opacity); }   /* เรตของสกุลนี้เก่ากว่าตัวอื่น */

  /* คอลัมน์เดียว = มีที่เหลือแนวนอน ขยายตัวอักษรได้อีก */
  #fxGrid[data-cols="1"]{ gap:0.5rem 0; }
  #fxGrid[data-cols="1"] .fx span{ font-size:calc(0.88rem * var(--fx-scale)); }
  #fxGrid[data-cols="1"] .fx b{ font-size:calc(1.55rem * var(--fx-scale)); }

  #fxMeta{
    font-size:0.62rem; letter-spacing:0.1em; font-weight:700;
    color:var(--label); opacity:.65;
    text-transform:uppercase; margin-top:0.6rem;
  }
  #fxMeta.bad{ color:var(--down); }

  /* ================= CONTENT MODE (เลือกด้วย ?mode= ใน URL) ================= */
  /* compact = ตัด sparkline / High-Low / บรรทัด as of ออก เพื่อให้ตัวอักษรใหญ่ที่สุด */
  body[data-content="compact"] #spark,
  body[data-content="compact"] #hl,
  body[data-content="compact"] #fxMeta{ display:none; }

  /* crypto = เฉพาะเหรียญ (สำหรับวางคู่กับกล่อง fx) */
  body[data-content="crypto"] #sep,
  body[data-content="crypto"] #fiat{ display:none; }

  /* fx = เฉพาะค่าเงิน */
  body[data-content="fx"] #crypto,
  body[data-content="fx"] #sep{ display:none; }

  /* split = กล่องเดียว แต่แบ่งซ้าย(crypto) - ขวา(ค่าเงินคอลัมน์เดียว) */
  body[data-content="split"] #inner{
    flex-direction:row; align-items:center; gap:1.1rem;
  }
  body[data-content="split"] #crypto{ width:max-content; }
  body[data-content="split"] #fiat{ width:max-content; }
  body[data-content="split"] #sep{
    width:1px; height:auto; align-self:stretch; margin:0;
    background:linear-gradient(180deg,transparent,rgba(255,255,255,.16),transparent);
  }
  body[data-content="split"] #fxMeta{ font-size:0.55rem; margin-top:0.5rem; }

  /* ค่าเงินเตี้ยลงแล้ว -> ฝั่ง crypto ขยายมากินที่ว่างแนวตั้งได้ */
  body[data-content="split"] #price{ font-size:4rem; }
  body[data-content="split"] #change{ font-size:1.45rem; }
  body[data-content="split"] #spark{ height:5.4rem; }
  body[data-content="split"] #crypto{ gap:0.5rem; }

  /* ================= โหมด ================= */
  body[data-mode="mini"] #hl,
  body[data-mode="mini"] #spark,
  body[data-mode="mini"] #prog,
  body[data-mode="mini"] #pair,
  body[data-mode="mini"] #sep,
  body[data-mode="mini"] #fiat{ display:none; }
  body[data-mode="mini"] #crypto{ gap:0.2rem; }
  body[data-mode="mini"] #price{ font-size:3.2rem; }

  body[data-mode="wide"] #hl{ display:none; }
  body[data-mode="wide"] #crypto{ gap:0.28rem; }
  body[data-mode="wide"] #pair{ font-size:0.78rem; }
  body[data-mode="wide"] #price{ font-size:3.2rem; }
  body[data-mode="wide"] #change{ font-size:1.15rem; }
  body[data-mode="wide"] #spark{ height:2.2rem; }
  body[data-mode="wide"] #sep{ margin:0.5rem 0 0.45rem; }
  body[data-mode="wide"] #fxGrid{ gap:0.25rem 0.5rem; }
  body[data-mode="wide"] #fxMeta{ margin-top:0.4rem; }

  /* ================= override เฉพาะ split ================= */
  /* ฝั่งซ้ายมีที่เหลือ -> ไม่ต้องซ่อน High/Low แม้กล่องจะเตี้ย (density wide) */
  body[data-content="split"] #hl{ display:flex; }

  /* ================= สถานะ ================= */
  body[data-state="stale"] #crypto{ opacity:.45; }
  #err{
    position:absolute; bottom:0.6rem; left:0; right:0;
    font-size:0.6rem; color:var(--down); letter-spacing:0.1em;
    text-transform:uppercase; display:none;
  }
  body[data-state="stale"] #err{ display:block; }
</style>
</head>

<body data-mode="full" data-state="loading" data-conn="down">

<div id="wrap">
 <div id="inner">

  <div id="crypto">
    <div id="pair"><span id="dot"></span><span id="pairName">—</span></div>
    <div id="price">—</div>
    <div id="change"><span id="chgPct">—</span><span class="abs" id="chgAbs"></span></div>
    <div id="hl">
      <div><span>24h High</span><b id="high">—</b></div>
      <div><span>24h Low</span><b id="low">—</b></div>
    </div>
    <svg id="spark" viewBox="0 0 300 100" preserveAspectRatio="none">
      <path id="sparkFill" d=""></path>
      <path id="sparkLine" d=""></path>
    </svg>
    <div id="prog"><div id="progBar"></div></div>
  </div>

  <div id="sep"></div>

  <div id="fiat">
    <div id="fxGrid"></div>
    <div id="fxMeta">—</div>
  </div>

 </div>
</div>

<div id="err">Connection lost — showing last known price</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {

  /* ---- เหรียญที่หมุน ----
     source: "binance" = WebSocket real-time
             "bybit"   = REST polling (ใช้เมื่อ Binance spot ไม่มีเหรียญนั้น)
     ถ้าวันหลัง Binance เปิด spot ให้เปลี่ยน source เป็น "binance" ได้เลย
     symbol ที่ยิงแล้วไม่มีจริง จะถูกข้ามออกจากรอบหมุนอัตโนมัติ        */
  coins: [
    { symbol:"BTCUSDT", source:"binance", decimals:0 },
    { symbol:"ETHUSDT", source:"binance", decimals:2 },
    { symbol:"SOLUSDT", source:"binance", decimals:2 },
    { symbol:"BNBUSDT", source:"binance", decimals:2 },
    { symbol:"MNTUSDT", source:"bybit",   decimals:4 },
    { symbol:"BATUSDT", source:"binance", decimals:4 },
  ],

  rotationMs:     8000,    // สลับเหรียญทุกกี่ ms
  bybitPollMs:   10000,    // polling ของ Bybit
  sparkRefreshMs:300000,   // รีเฟรช sparkline ของเหรียญที่แสดงอยู่ (5 นาที)
  sparkBars:        96,    // 96 แท่ง x 15 นาที = 24 ชม.

  /* ---- ค่าเงิน (base = THB) ----
     unit = แสดง "บาทต่อกี่หน่วย" — JPY ใช้ 100 ตามบอร์ดร้านแลกเงินไทย */
  fiat: [
    { code:"USD", unit:1,   label:"USD"     },
    { code:"JPY", unit:100, label:"JPY 100" },
    { code:"SGD", unit:1,   label:"SGD"     },
    { code:"CNY", unit:1,   label:"CNY"     },
    { code:"HKD", unit:1,   label:"HKD"     },
    { code:"TWD", unit:1,   label:"TWD"     },
  ],
  fiatRefreshMs: 1800000,  // 30 นาที (ข้อมูลจริงเปลี่ยนวันละครั้ง)

  /* ปักหมุดแหล่งข้อมูล FX เช่น "ECB" = official reference rate ตัวเดียว
     คำเตือน: ECB ไม่มี TWD — ถ้าปักหมุด ไต้หวันจะขึ้น n/a
     ค่าว่าง = blended จากหลาย provider (TWD มี 24 แหล่ง)              */
  fiatProvider: "",

  timeZone: "Asia/Bangkok",
  locale:   "en-US",
  fill:     0.90,          // เนื้อหากินพื้นที่กี่ % ของกล่อง
  staleAfterMs: 90000,

  /* โหมดเนื้อหาเริ่มต้น ถ้าไม่ได้ใส่ ?mode= ใน URL
     all     = ครบทุกอย่าง เรียงบน-ล่าง
     compact = ตัด sparkline/High-Low/as-of ออก -> ตัวอักษรใหญ่สุด
     split   = กล่องเดียว แบ่งซ้าย(crypto เต็ม) - ขวา(ค่าเงินคอลัมน์เดียว)
     crypto  = เฉพาะเหรียญ
     fx      = เฉพาะค่าเงิน                                        */
  defaultContent: "compact",

  /* จำนวนคอลัมน์ของตารางค่าเงิน
     "auto" = เลือกเองตามสัดส่วนกล่อง (กล่องผอมสูง -> 1 คอลัมน์)
     ใส่เลข 1 / 2 / 3 เพื่อบังคับ                                    */
  fxColumns: "auto",

  /* สัดส่วนความกว้าง ซ้าย(crypto) : ขวา(ค่าเงิน) ในโหมด split
     0.60 = ซ้ายกิน 60% · 0.50 = เท่ากัน · 0.70 = ซ้ายกิน 70%
     ทำงานโดยปรับขนาดฟอนต์ฝั่งขวา ไม่ใช่การตัดกล่อง                */
  splitRatio: 0.60,
};

/* อ่านโหมดจาก URL เช่น  index.html?mode=fx  */
const QS = new URLSearchParams(location.search);

const CONTENT = (() => {
  const m = (QS.get("mode") || CONFIG.defaultContent).toLowerCase();
  return ["all","compact","split","crypto","fx"].includes(m) ? m : "all";
})();
document.body.dataset.content = CONTENT;

/* ---- พื้นหลังจาก ?bg= ----
   ชื่อสำเร็จรูป: dark · tint · clear · black · glass
   หรือใส่ hex เองได้: ?bg=0A0E0C  /  ?bg=000000e6 (8 หลัก = มี alpha)
   ไม่ใส่อะไรเลย = ใช้ค่า --bg ใน :root                               */
(function applyBg() {
  const BG = {
    dark:  "#0A0E0C",            // ดำอมเขียว ทึบ — ค่าแนะนำสำหรับ Web View
    black: "#000000",            // ดำสนิท
    tint:  "rgba(0,0,0,.92)",    // ดำเกือบทึบ
    glass: "rgba(0,0,0,.35)",    // ทินท์จางแบบเดิมสมัย iframe (บนฐานขาวจะออกเทา)
    clear: "transparent"         // ทดสอบว่า Web View รองรับพื้นโปร่งไหม
  };

  const raw = (QS.get("bg") || "").trim().toLowerCase();
  if (!raw) return;

  let val = BG[raw];
  if (!val && /^[0-9a-f]{3,8}$/.test(raw)) val = "#" + raw;   // hex ล้วน ไม่ต้องใส่ #
  if (!val) return;                                           // ค่าพิลึก = ไม่ต้องสนใจ

  document.documentElement.style.setProperty("--bg", val);

  // พื้นโปร่ง = ตัวอักษรอาจไปทับ wallpaper -> เปิดเงากลับมากันกลืน
  const opaque = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(val);
  if (!opaque) {
    document.documentElement.style.setProperty(
      "--shadow", "0 0.05em 0.2em rgba(0,0,0,.95), 0 0 0.55em rgba(0,0,0,.6)");
  }
})();
/* ========================================================== */

const BINANCE = "https://api.binance.com/api/v3";
const BYBIT   = "https://api.bybit.com/v5/market";
const FRANK2  = "https://api.frankfurter.dev/v2/rates";
const FRANK1  = "https://api.frankfurter.app/latest";   // fallback ถ้า v2 เปลี่ยน schema

const $ = id => document.getElementById(id);
const body = document.body;

let coins = CONFIG.coins.map(c => ({ ...c, ok:false, data:null, spark:null }));
let active = [];
let idx = 0;
let rotTimer = null;
let lastPrice = null;
let lastUpdate = 0;
let maxPriceLen = 0;
let ws = null;

/* ---------------- ฟอร์แมต ---------------- */
const fmtPrice = (n, d) => "$" + Number(n).toLocaleString(CONFIG.locale, {
  minimumFractionDigits:d, maximumFractionDigits:d
});

const prettyPair = s => s.replace(/(USDT|USDC|USD)$/, m => " / " + m);

/* ---------------- แปลงข้อมูลให้เป็นรูปแบบกลาง ---------------- */
function fromBinance(j) {
  return {
    price:+j.lastPrice, pct:+j.priceChangePercent, abs:+j.priceChange,
    high:+j.highPrice,  low:+j.lowPrice, vol:+j.quoteVolume
  };
}
function fromBybit(r) {
  // price24hPcnt ของ Bybit เป็นสัดส่วน (0.0034) ไม่ใช่เปอร์เซ็นต์ -> คูณ 100
  const price = +r.lastPrice, pct = (+r.price24hPcnt) * 100;
  const prev  = +r.prevPrice24h || (price / (1 + pct/100));
  return {
    price, pct, abs: price - prev,
    high:+r.highPrice24h, low:+r.lowPrice24h, vol:+r.turnover24h
  };
}

/* ---------------- ตรวจว่า symbol มีจริงไหม ---------------- */
async function probe(c) {
  try {
    if (c.source === "binance") {
      const r = await fetch(`${BINANCE}/ticker/24hr?symbol=${c.symbol}`, {cache:"no-store"});
      if (!r.ok) return;                       // 400 = Invalid symbol
      c.data = fromBinance(await r.json());
    } else {
      const r = await fetch(`${BYBIT}/tickers?category=spot&symbol=${c.symbol}`, {cache:"no-store"});
      if (!r.ok) return;
      const j = await r.json();
      const row = j && j.retCode === 0 && j.result && j.result.list && j.result.list[0];
      if (!row) return;
      c.data = fromBybit(row);
    }
    c.ok = true;
  } catch (e) { /* ปล่อยให้ ok = false -> ถูกข้าม */ }
}

/* ---------------- วาดเหรียญที่กำลังแสดง ---------------- */
function paint(c, animate) {
  if (!c || !c.data) return;
  const d = c.data;
  const up = d.pct >= 0;

  document.documentElement.style.setProperty("--accent", up ? "var(--up)" : "var(--down)");

  const txt = fmtPrice(d.price, c.decimals);

  // ล็อกความกว้างตามเหรียญที่ยาวสุดที่เคยเจอ (โตอย่างเดียว ไม่หด = ไม่กระตุก)
  if (txt.length > maxPriceLen) {
    maxPriceLen = txt.length;
    $("price").style.minWidth = maxPriceLen + "ch";
    fit();
  }

  if (animate && lastPrice !== null && d.price !== lastPrice) {
    const el = $("price");
    const cls = d.price > lastPrice ? "flash-up" : "flash-down";
    el.classList.remove("flash-up","flash-down");
    void el.offsetWidth;
    el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), 500);
  }
  lastPrice = d.price;

  $("pairName").textContent = prettyPair(c.symbol);
  $("price").textContent    = txt;
  $("chgPct").textContent   = (up ? "▲ +" : "▼ ") + d.pct.toFixed(2) + "%";
  $("chgAbs").textContent   = isFinite(d.abs)
    ? (up ? "+" : "") + Number(d.abs).toLocaleString(CONFIG.locale,{maximumFractionDigits:c.decimals})
    : "";
  $("high").textContent = fmtPrice(d.high, c.decimals);
  $("low").textContent  = fmtPrice(d.low,  c.decimals);

  drawSpark(c.spark);

  lastUpdate = Date.now();
  body.dataset.state = "ok";
}

/* ---------------- การหมุน ---------------- */
function show(i, instant) {
  if (!active.length) return;
  idx = (i + active.length) % active.length;
  const c = active[idx];

  const el = $("crypto");
  if (instant) {
    lastPrice = null;
    paint(c, false);
    restartProgress();
  } else {
    el.classList.add("fading");
    setTimeout(() => {
      lastPrice = null;             // กัน flash ปลอมตอนสลับเหรียญ
      paint(c, false);
      el.classList.remove("fading");
      restartProgress();
    }, 180);
  }
  if (!c.spark) loadSpark(c);
}

function next() { show(idx + 1); }

function startRotation() {
  if (rotTimer) clearInterval(rotTimer);
  if (active.length < 2) { $("prog").style.display = "none"; return; }
  rotTimer = setInterval(next, CONFIG.rotationMs);
}

function restartProgress() {
  if (active.length < 2) return;
  const b = $("progBar");
  b.style.transition = "none";
  b.style.width = "0%";
  void b.offsetWidth;
  b.style.transition = `width ${CONFIG.rotationMs}ms linear`;
  b.style.width = "100%";
}

/* ---------------- Binance WebSocket ---------------- */
function connectWS() {
  const list = active.filter(c => c.source === "binance");
  if (!list.length) return;

  const streams = list.map(c => c.symbol.toLowerCase() + "@ticker").join("/");
  try { ws && ws.close(); } catch(e) {}
  try { ws = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${streams}`); }
  catch(e) { return; }

  ws.onopen = () => { body.dataset.conn = "live"; };

  ws.onmessage = ev => {
    try {
      const msg = JSON.parse(ev.data);
      const j = msg.data || msg;
      const c = coins.find(x => x.symbol === j.s);
      if (!c) return;
      c.data = { price:+j.c, pct:+j.P, abs:+j.p, high:+j.h, low:+j.l, vol:+j.q };
      if (active[idx] === c) paint(c, true);   // อัปเดตสดเฉพาะตัวที่แสดงอยู่
      lastUpdate = Date.now();
    } catch(e) {}
  };

  ws.onclose = () => { body.dataset.conn = "down"; setTimeout(connectWS, 8000); };
  ws.onerror = () => { try { ws.close(); } catch(e) {} };
}

/* ---------------- Bybit polling ---------------- */
async function pollBybit() {
  const list = active.filter(c => c.source === "bybit");
  for (const c of list) {
    try {
      const r = await fetch(`${BYBIT}/tickers?category=spot&symbol=${c.symbol}`, {cache:"no-store"});
      if (!r.ok) continue;
      const j = await r.json();
      const row = j.retCode === 0 && j.result && j.result.list && j.result.list[0];
      if (!row) continue;
      c.data = fromBybit(row);
      if (active[idx] === c) paint(c, true);
      lastUpdate = Date.now();
    } catch(e) {}
  }
}

/* ---------------- Sparkline ---------------- */
async function loadSpark(c) {
  try {
    let closes = [];
    if (c.source === "binance") {
      const r = await fetch(`${BINANCE}/klines?symbol=${c.symbol}&interval=15m&limit=${CONFIG.sparkBars}`, {cache:"no-store"});
      if (!r.ok) return;
      closes = (await r.json()).map(k => +k[4]);
    } else {
      const r = await fetch(`${BYBIT}/kline?category=spot&symbol=${c.symbol}&interval=15&limit=${CONFIG.sparkBars}`, {cache:"no-store"});
      if (!r.ok) return;
      const j = await r.json();
      if (j.retCode !== 0 || !j.result || !j.result.list) return;
      closes = j.result.list.map(k => +k[4]).reverse();   // Bybit เรียงใหม่ -> เก่า
    }
    if (!closes.length) return;
    c.spark = closes;
    if (active[idx] === c) drawSpark(closes);
  } catch(e) {}
}

function drawSpark(vals) {
  if (!vals || !vals.length) {
    $("sparkLine").setAttribute("d","");
    $("sparkFill").setAttribute("d","");
    return;
  }
  const W = 300, H = 100, PAD = 6;
  const min = Math.min(...vals), max = Math.max(...vals), range = (max-min) || 1;
  const pts = vals.map((v,i) => [
    (i/(vals.length-1))*W,
    PAD + (1 - (v-min)/range) * (H - PAD*2)
  ]);
  const line = pts.map((p,i) => (i?"L":"M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  $("sparkLine").setAttribute("d", line);
  $("sparkFill").setAttribute("d", line + ` L${W} ${H} L0 ${H} Z`);
}

/* ---------------- FX ---------------- */
function buildFxGrid() {
  $("fxGrid").innerHTML = CONFIG.fiat.map(f =>
    `<div class="fx miss" id="fx_${f.code}"><span>${f.label}</span><b>—</b></div>`
  ).join("");
}

/* v2 กับ v1 คืนคนละ schema — ยืนยันจากการยิงจริง 9 ส.ค. 2569

   v2: array แบน หนึ่งแถวต่อหนึ่งสกุล และ "แต่ละสกุลมีวันที่ของตัวเอง"
       [{"date":"2026-08-09","base":"THB","quote":"CNY","rate":0.20397}, ...]
       TWD มักช้ากว่าตัวอื่น เพราะมาจาก provider คนละชุด

   v1: object เดียว ใช้ from/to (ไม่ใช่ base/symbols) และ "ไม่มี TWD"
       {"amount":1.0,"base":"THB","date":"2026-08-07","rates":{...}}          */
function extractRates(j) {
  if (!j) return null;

  // ---- v2: array แบน ----
  if (Array.isArray(j) && j.length && j[0] && j[0].quote !== undefined) {
    const rates = {}, dates = {};
    for (const row of j) {
      if (!row || !row.quote) continue;
      rates[row.quote] = row.rate;
      dates[row.quote] = row.date;
    }
    if (!Object.keys(rates).length) return null;
    const newest = Object.values(dates).sort().pop();
    return { rates, dates, date:newest };
  }

  // ---- v1: object เดียว วันที่เดียวทั้งชุด ----
  if (j.rates && typeof j.rates === "object") {
    const dates = {};
    Object.keys(j.rates).forEach(k => dates[k] = j.date);
    return { rates:j.rates, dates, date:j.date };
  }

  if (j.data) return extractRates(j.data);
  return null;
}

async function loadFx() {
  const codes = CONFIG.fiat.map(f => f.code).join(",");
  const urls = [
    `${FRANK2}?base=THB&quotes=${codes}` + (CONFIG.fiatProvider ? `&providers=${CONFIG.fiatProvider}` : ""),
    `${FRANK1}?from=THB&to=${codes}`          // fallback v1 (ใช้ from/to และไม่มี TWD)
  ];

  for (const url of urls) {
    try {
      const r = await fetch(url, {cache:"no-store"});
      if (!r.ok) continue;
      const got = extractRates(await r.json());
      if (!got || !got.rates) continue;
      renderFx(got);
      return;
    } catch(e) {}
  }

  // ทั้ง v2 และ v1 ล้ม — บอกบนจอเลย ไม่ต้องเปิด DevTools ถึงจะรู้
  $("fxMeta").textContent = "FX UNAVAILABLE";
  $("fxMeta").classList.add("bad");
}

function renderFx(got) {
  const dates = got.dates || {};

  CONFIG.fiat.forEach(f => {
    const el = $("fx_" + f.code);
    if (!el) return;
    const rate = got.rates[f.code];              // = หน่วยต่างประเทศ ต่อ 1 บาท
    const b = el.querySelector("b");

    if (!rate) { el.classList.add("miss"); el.classList.remove("lag"); b.textContent = "n/a"; return; }

    el.classList.remove("miss");
    b.textContent = (f.unit / rate).toFixed(2);  // -> บาทต่อ unit

    // สกุลที่วันที่เก่ากว่าตัวอื่น (เช่น TWD) ให้หรี่ลง — บอกได้โดยไม่ต้องเพิ่มข้อความ
    el.classList.toggle("lag", !!(dates[f.code] && got.date && dates[f.code] < got.date));
  });

  let d = got.date || "";
  try {
    d = new Date(got.date + "T00:00:00Z").toLocaleDateString("en-GB",
        { day:"numeric", month:"short", year:"numeric", timeZone:"UTC" });
  } catch(e) {}
  $("fxMeta").textContent = "MID · THB per unit · as of " + d;
  $("fxMeta").classList.remove("bad");
  fit();
}

/* ---------------- auto-fit ---------------- */
function fit() {
  const w = window.innerWidth  || document.documentElement.clientWidth;
  const h = window.innerHeight || document.documentElement.clientHeight;
  if (!w || !h) return;

  const ratio = h / w;
  body.dataset.mode = ratio < 0.30 ? "mini" : (ratio < 0.80 ? "wide" : "full");

  // จำนวนคอลัมน์ของค่าเงิน — กล่องยิ่งผอมสูง ยิ่งควรลดคอลัมน์ เพื่อให้ตัวเลขโตขึ้น
  let cols = CONFIG.fxColumns;
  if (cols === "auto") {
    if (CONTENT === "split")        cols = 1;
    else if (CONTENT === "fx")      cols = ratio > 1.4 ? 1 : (ratio > 0.9 ? 2 : 3);
    else if (CONTENT === "compact") cols = ratio > 0.9 ? 2 : 3;
    else                            cols = 3;
  }
  $("fxGrid").style.gridTemplateColumns = `repeat(${cols},1fr)`;
  $("fxGrid").dataset.cols = cols;

  const html = document.documentElement;

  /* --- คุมสัดส่วนซ้าย:ขวา ในโหมด split ---
     ความกว้างฝั่งซ้าย (cw) ไม่ขึ้นกับ --fx-scale ส่วนฝั่งขวา (fw) แปรผันตรงกับมัน
     ดังนั้นแก้สมการ cw/(cw+fw) = target ได้ค่า scale ที่ถูกต้องในก้าวเดียว     */
  if (CONTENT === "split") {
    const t = Math.min(0.85, Math.max(0.3, CONFIG.splitRatio));
    for (let i = 0; i < 3; i++) {
      const cw = $("crypto").offsetWidth, fw = $("fiat").offsetWidth;
      if (!cw || !fw) break;
      const cur = cw / (cw + fw);
      if (Math.abs(cur - t) < 0.005) break;
      let sc = parseFloat(html.style.getPropertyValue("--fx-scale")) || 1;
      sc = sc * (cw * (1 - t)) / (t * fw);
      html.style.setProperty("--fx-scale", Math.max(0.45, Math.min(1.8, sc)));
    }
  }

  const inner = $("inner");
  const availW = w * CONFIG.fill, availH = h * CONFIG.fill;

  let f = parseFloat(html.style.fontSize) || 20;
  for (let i = 0; i < 6; i++) {
    html.style.fontSize = f + "px";
    const ih = inner.offsetHeight, iw = inner.offsetWidth;
    if (!ih || !iw) break;
    const k = Math.min(availH/ih, availW/iw);
    if (k > 0.99 && k < 1.01) break;
    f = Math.max(4, Math.min(140, f * k));
  }
}

/* ---------------- stale check ---------------- */
setInterval(() => {
  if (lastUpdate && Date.now() - lastUpdate > CONFIG.staleAfterMs) body.dataset.state = "stale";
}, 5000);

/* ---------------- interaction ---------------- */
document.addEventListener("click", () => { next(); });
window.addEventListener("resize", fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);

/* ---------------- start ---------------- */
(async function start() {
  buildFxGrid();
  fit();

  const wantCrypto = CONTENT !== "fx";
  const wantFx     = CONTENT !== "crypto";

  if (wantFx) {
    loadFx();
    setInterval(loadFx, CONFIG.fiatRefreshMs);
  }

  if (!wantCrypto) { fit(); return; }   // โหมด fx ล้วน — ไม่ต้องยิง exchange เลย

  await Promise.all(coins.map(probe));
  active = coins.filter(c => c.ok);

  if (!active.length) {
    $("pairName").textContent = "NO DATA";
    $("price").textContent = "—";
    return;
  }

  // ตั้งความกว้างเริ่มต้นจากทุกเหรียญที่ probe สำเร็จ เพื่อ fit ครั้งเดียวจบ
  maxPriceLen = Math.max(...active.map(c => fmtPrice(c.data.price, c.decimals).length));
  $("price").style.minWidth = maxPriceLen + "ch";

  show(0, true);
  startRotation();
  connectWS();
  setInterval(pollBybit, CONFIG.bybitPollMs);

  setInterval(() => { const c = active[idx]; if (c) loadSpark(c); }, CONFIG.sparkRefreshMs);

  fit();
})();
</script>
